<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/webp" href="/favicon.webp" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="GhuniNew" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="apple-touch-icon" href="/GhuniNew_color_180x149.webp" />
        <link rel="canonical" href="https://nexora.bigbrain-studio.com/" />
        <title>nexora</title>
    </head>
    <body>
        <div id="root"></div>
        <script>
            (() => {
                let storedTheme = null;

                try {
                    storedTheme = localStorage.getItem("theme");
                } catch {
                    // Ignore localStorage errors
                }

                const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

                const theme = ["light", "dark", "system"].includes(storedTheme) ? storedTheme : "dark";

                document.documentElement.classList.toggle(
                    "dark",
                    theme === "dark" || (theme === "system" && systemTheme === "dark"),
                );
            })();
        </script>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
